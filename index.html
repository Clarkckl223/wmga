<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑白思弈 · 围棋学堂 搬家了</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://wmga.com.my/xuetang/">
<style>
:root{--bg:#f6f3ec;--panel:#fff;--ink:#222;--sub:#666;--acc:#1f6fb2;--line:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--panel:#1f2630;--ink:#eee;--sub:#aab;--acc:#7cb7e8;--line:#334}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border-radius:16px;padding:22px;max-width:460px;width:100%;box-shadow:0 6px 28px rgba(0,0,0,.15)}
h1{font-size:1.3rem;margin:0 0 6px}.logo{font-size:2rem;letter-spacing:-4px}.sub{color:var(--sub);font-size:.92rem}
a.url{color:var(--acc);font-weight:700;font-size:1.15rem;text-decoration:none}
.btn{display:block;width:100%;margin:10px 0 0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:1rem;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#msg{margin-top:12px;min-height:1.5em}.foot{margin-top:16px;font-size:.75rem;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">●○</div>
  <h1>黑白思弈 · 围棋学堂 搬家了</h1>
  <p class="sub">The WMGA Go Academy has moved.</p>
  <p>新网址 New address：<br><a class="url" id="to" href="https://wmga.com.my/xuetang/">wmga.com.my/xuetang</a></p>
  <div id="act" hidden>
    <p id="have"></p>
    <button class="btn pri" id="go">📦 把资料搬到新网站 · Move my data</button>
    <button class="btn" id="dl">💾 下载备份档 · Download backup</button>
    <button class="btn" id="skip">只去新网站，不带资料 · Just go</button>
  </div>
  <p id="msg" class="sub"></p>
  <p class="foot">© 黑白思弈馆 WEIQI &amp; MIND GAME ACADEMY</p>
</div>
<script>
(function(){
  // 测试时（localhost）可以用 ?to= 指定新网址
  var NEW='https://wmga.com.my/xuetang/';
  try{var q=new URLSearchParams(location.search).get('to');if(q&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname))NEW=q}catch(e){}
  var NEWO=new URL(NEW).origin,HASH=location.hash||'',DEST=NEW+HASH;
  document.getElementById('to').href=DEST;
  var $=function(id){return document.getElementById(id)},msg=function(t){$('msg').textContent=t};
  function lsAll(){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);o[k]=localStorage.getItem(k)}}catch(e){}return o}
  function idbAll(){return new Promise(function(res){try{var q=indexedDB.open('wmgaGames',1);
    q.onupgradeneeded=function(){q.result.createObjectStore('g')};
    q.onsuccess=function(){var db=q.result,out={};try{var c=db.transaction('g','readonly').objectStore('g').openCursor();
      c.onsuccess=function(){var k=c.result;if(k){out[k.key]=k.value;k.continue()}else res(out)};c.onerror=function(){res(out)}}catch(e){res(out)}};
    q.onerror=function(){res({})}}catch(e){res({})}})}
  function pack(){return idbAll().then(function(g){return{v:1,from:location.origin,t:Date.now(),ls:lsAll(),games:g}})}
  function go(){location.replace(DEST)}
  var moved=false;try{moved=!!localStorage.getItem('goReview.moved')}catch(e){}
  var ls=lsAll(),keys=Object.keys(ls).filter(function(k){return /^goReview|^wmga|^ts/.test(k)});
  idbAll().then(function(g){
    var nG=Object.keys(g).length,nL=0;try{nL=Object.keys((JSON.parse(ls['goReview.v1']||'null')||{}).games||{}).length}catch(e){}
    var n=Math.max(nG,nL);
    if(moved||(!keys.length&&!nG)){go();return}  // 已经搬过、或这台装置没有资料：直接去新网站
    $('have').textContent='这台装置上有 '+n+' 盘棋谱，还有做题纪录和设定。按下面的按钮带到新网站（大约几秒钟）。';
    $('act').hidden=false;
  });
  $('skip').onclick=function(){try{localStorage.setItem('goReview.moved','skip')}catch(e){}go()};
  $('dl').onclick=function(){pack().then(function(p){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p)],{type:'application/json'}));
    a.download='wmga-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    msg('已下载。到新网站打开 '+NEW+'#mig ，选这个档案就能汇入。')})};
  $('go').onclick=function(){
    var w=window.open(NEW+'#mig','wmga_mig');
    if(!w){msg('视窗被挡住了：请允许弹出视窗再按一次，或用「下载备份档」。');return}
    msg('正在打包…');var P=pack(),sent=false;
    window.addEventListener('message',function(e){
      if(e.origin!==NEWO||!e.data)return;
      if(e.data.type==='wmga-mig-ready'&&!sent){sent=true;msg('正在传送…');P.then(function(p){w.postMessage({type:'wmga-mig',pkg:p},NEWO)})}
      else if(e.data.type==='wmga-mig-done'){try{localStorage.setItem('goReview.moved',String(Date.now()))}catch(x){}msg('✅ 搬好了（'+e.data.n+' 盘棋谱）。马上带你去新网站…');setTimeout(go,1500)}
      else if(e.data.type==='wmga-mig-fail'){msg('⚠ 没有成功：'+(e.data.msg||'')+'。可以改用「下载备份档」。')}
    });
    setTimeout(function(){if(!sent)msg('新网站还没回应。如果新视窗打不开，请改用「下载备份档」。')},15000);
  };
})();
</script>
</body>
</html>
